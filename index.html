<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Timer</title>
<style>
:root{--navy:#102b63;--sky:#43c5f4;--yellow:#ffe34f;--green:#45d95b;--red:#ff3154;--white:#fff}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--navy);background:linear-gradient(145deg,#43c5f4,#159be7);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;background:#fff;opacity:.16}body:before{width:300px;height:300px;top:-120px;right:-70px}body:after{width:220px;height:220px;bottom:-100px;left:-70px}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 36px;gap:20px}
.header{background:var(--yellow);padding:12px 28px;border-radius:22px;box-shadow:0 7px 0 #e8bd24;transform:rotate(-1deg);text-align:center}.header h1{margin:0;font-size:clamp(1.7rem,4vw,3rem);font-weight:1000;letter-spacing:-1px}
.sub{margin:0;color:#fff;font-weight:800;font-size:clamp(1rem,2vw,1.2rem);text-shadow:0 2px 2px #0877b8}
.timer-wrap{width:min(72vw,430px);min-width:260px;aspect-ratio:1;position:relative;display:grid;place-items:center;filter:drop-shadow(0 10px 0 rgba(5,47,106,.18))}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.track{fill:none;stroke:var(--navy);stroke-width:13}.progress{fill:none;stroke:var(--green);stroke-width:11;stroke-linecap:round;transition:stroke .25s;}
.face{width:78%;height:78%;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -7px 0 #e8f5ff;text-align:center}
.time{font-size:clamp(3.7rem,12vw,7rem);line-height:1;font-weight:1000;letter-spacing:-.07em;font-variant-numeric:tabular-nums}.label{font-size:clamp(1rem,3vw,1.65rem);font-weight:900;margin-top:8px}
.status{min-height:34px;color:white;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:900;text-align:center;text-shadow:0 2px 2px #0877b8}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.btn{border:0;border-radius:18px;padding:15px 24px;font:900 clamp(1rem,2.5vw,1.25rem) system-ui;cursor:pointer;box-shadow:0 6px 0 rgba(7,43,99,.28);transition:transform .1s,box-shadow .1s;min-width:115px}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(7,43,99,.28)}.btn:focus-visible{outline:4px solid white;outline-offset:4px}.primary{background:var(--red);color:#fff;min-width:160px}.reset{background:var(--yellow);color:var(--navy)}.minus,.plus{background:#fff;color:var(--navy);min-width:64px;padding:14px 18px}
.presets{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.preset{background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.75);color:#fff;padding:8px 14px;border-radius:999px;font-weight:900;cursor:pointer}.preset[aria-pressed="true"]{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}.hint{color:#fff;font-size:.88rem;font-weight:700;text-align:center;opacity:.95}
.done .progress{stroke:var(--red)}.done .face{animation:pop .55s ease-in-out 2}.done .time{color:var(--red)}@keyframes pop{50%{transform:scale(1.035)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><main id="app">
<header class="header"><h1>🌟 Classroom Timer 🌟</h1></header>
<p class="sub">Ready, set, focus!</p>
<section class="timer-wrap" aria-label="Countdown timer">
<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="progress" id="progress" cx="50" cy="50" r="44"/></svg>
<div class="face"><div class="time" id="time" role="timer" aria-live="off">05:00</div><div class="label" id="label">MINUTES LEFT</div></div>
</section>
<div class="status" id="status" aria-live="polite">You’ve got this! 💪</div>
<div class="controls"><button class="btn minus" id="minus" aria-label="Subtract one minute">−1</button><button class="btn primary" id="toggle">▶ Start</button><button class="btn reset" id="reset">↻ Reset</button><button class="btn plus" id="plus" aria-label="Add one minute">+1</button></div>
<div class="presets" aria-label="Choose timer length"><button class="preset" data-min="1">1 min</button><button class="preset" data-min="3">3 min</button><button class="preset" data-min="5" aria-pressed="true">5 min</button><button class="preset" data-min="10">10 min</button></div>
<p class="hint">Tip: Use full screen for a big, easy-to-see display.</p>
</main>
<script>
(()=>{
const circumference=2*Math.PI*44;const timeEl=document.getElementById('time'),label=document.getElementById('label'),statusEl=document.getElementById('status'),toggle=document.getElementById('toggle'),progress=document.getElementById('progress'),app=document.getElementById('app');
let total=300,remaining=300,running=false,endsAt=0,raf=null,finished=false;
progress.style.strokeDasharray=String(circumference);progress.style.strokeDashoffset='0';
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){timeEl.textContent=fmt(remaining);const ratio=total?remaining/total:0;progress.style.strokeDashoffset=String(circumference*(1-ratio));if(ratio<.2&&!finished)progress.style.stroke='#ffb52e';else if(!finished)progress.style.stroke='';document.title=fmt(remaining)+' — Classroom Timer';}
function stopLoop(){if(raf!==null)cancelAnimationFrame(raf);raf=null}
function tick(){if(!running)return;remaining=Math.max(0,(endsAt-Date.now())/1000);render();if(remaining<=0){running=false;finished=true;stopLoop();app.classList.add('done');toggle.textContent='↻ Start Again';label.textContent="TIME'S UP!";statusEl.textContent='🎉 Great work! You did it!';beep();return}raf=requestAnimationFrame(tick)}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();[0,0.22,0.44].forEach((delay,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=[660,784,988][i];g.gain.setValueAtTime(.001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+.18);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+.2)});setTimeout(()=>ctx.close(),1000)}catch(e){}}
function pause(){remaining=Math.max(0,(endsAt-Date.now())/1000);running=false;stopLoop();toggle.textContent='▶ Resume';statusEl.textContent='⏸ Paused — take your time';render()}
function start(){if(finished){reset();}if(remaining<=0)remaining=total;running=true;endsAt=Date.now()+remaining*1000;toggle.textContent='⏸ Pause';label.textContent='MINUTES LEFT';statusEl.textContent='✨ Keep going!';app.classList.remove('done');raf=requestAnimationFrame(tick)}
function reset(){running=false;stopLoop();remaining=total;finished=false;app.classList.remove('done');toggle.textContent='▶ Start';label.textContent='MINUTES LEFT';statusEl.textContent='You’ve got this! 💪';render()}
toggle.addEventListener('click',()=>running?pause():start());document.getElementById('reset').addEventListener('click',reset);
document.getElementById('minus').addEventListener('click',()=>{total=Math.max(60,total-60);remaining=Math.max(0,remaining-60);if(running){endsAt=Date.now()+remaining*1000;if(remaining===0){pause();}}else render();syncPresets()});
document.getElementById('plus').addEventListener('click',()=>{total=Math.min(3600,total+60);remaining=Math.min(3600,remaining+60);if(running)endsAt=Date.now()+remaining*1000;render();syncPresets()});
function syncPresets(){document.querySelectorAll('.preset').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.min)*60===total?'true':'false'))}
document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>{total=Number(b.dataset.min)*60;reset();syncPresets()}));
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();running?pause():start()}if(e.key.toLowerCase()==='r')reset()});render();
})();
</script></body></html>
